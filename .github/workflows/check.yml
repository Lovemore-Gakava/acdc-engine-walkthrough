name: walkthrough

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install packages
        run: Rscript -e 'install.packages(c("jsonlite", "nanoparquet", "car", "emmeans"))'
      - name: Walkthrough
        run: Rscript walkthrough.R
      - name: Experiments
        run: Rscript experiments.R
      - name: The app's own call gives the same
        run: Rscript check.R
      - name: Our R sources are ASCII-only
        if: runner.os == 'Linux'
        run: |
          if grep -lP '[^\x00-\x7F]' walkthrough.R experiments.R check.R R/*.R capture/*.R; then
            echo "non-ASCII characters in the files above"; exit 1
          fi
